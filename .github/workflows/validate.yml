name: Validate

on:
  push:
    branches-ignore:
      - "release/**"
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  validate-hacs:
    runs-on: "ubuntu-latest"
    steps:
      - name: HACS validation
        uses: "hacs/action@main"
        with:
          category: "integration"
          ignore: "brands"

  quality:
    if: github.event_name != 'schedule'
    runs-on: "ubuntu-latest"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install quality tools
        run: python -m pip install --upgrade pip -r requirements-dev.txt

      # -p no:homeassistant disables pytest-homeassistant-custom-component's
      # autouse fixtures, which assume a real `homeassistant` package is
      # importable — tests/ instead loads the integration against hand-rolled
      # stub modules and would otherwise fail once those fixtures run.
      - name: Run unit tests
        run: python -m pytest -p no:homeassistant -q tests

      - name: Run end-to-end tests
        run: python -m pytest -q tests_integration

      - name: Lint integration and tests
        run: python -m ruff check custom_components tests tests_integration

      - name: Check formatting
        run: python -m ruff format --check custom_components tests tests_integration

      - name: Type check integration
        run: python -m mypy
